name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (format, lint, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
      - name: go vet
        run: go vet ./cmd/... ./internal/...
      - name: go test
        run: go test -race -cover ./cmd/... ./internal/...
      - name: Build binary (without embedded web assets)
        run: go build ./cmd/cairn

  frontend:
    name: Frontend (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  production-build:
    name: Production binary with embedded frontend
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build the single binary
        run: make build
      - name: Smoke-test the produced binary
        run: |
          tmp="$(mktemp -d)"
          CAIRN_DATA_DIR="$tmp/data" CAIRN_HTTP_ADDR=127.0.0.1:18717 ./bin/cairn &
          pid=$!
          sleep 2
          curl -fsS http://127.0.0.1:18717/api/v1/health
          echo
          curl -fsS http://127.0.0.1:18717/ | grep -q "<title>Cairn</title>"
          kill "$pid"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cairn-linux-amd64
          path: bin/cairn
          if-no-files-found: error

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build container image
        run: docker build -t cairn:ci .