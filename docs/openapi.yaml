        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /libraries/{libraryID}/tags:
    get:
      tags: [Organization]
      operationId: listTags
      summary: List tags in the library
      description: >
        Requires an authenticated session with the `read` capability on the
        library. Returns every tag, ordered by name. Tags are library-scoped and
        independent of folders.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      responses:
        '200':
          description: Tags
