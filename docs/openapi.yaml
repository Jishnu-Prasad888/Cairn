openapi: 3.0.3
info:
  title: Cairn API
  version: 0.1.0
  description: >
    Cairn is a self-hosted personal media, file, and memory server. This
    specification is the complete contract for the HTTP API. A client (web app,
    React Native, desktop, CLI) can be built against this document alone.

    The API is versioned in the URL. Response bodies and error envelopes follow
    the conventions in docs/api.md — in particular every error is a JSON object
    of the shape defined by the ErrorResponse schema, and every response carries
    an X-Request-ID header.
  termsOfService: https://example.com/terms # placeholder until licensing is decided
  contact:
    name: Cairn
    url: https://github.com/Jishnu-Prasad888/Cairn
servers:
  - url: http://127.0.0.1:8715/api/v1
    description: Local default
tags:
  - name: System
    description: Liveness, versions, and server-wide metadata
  - name: Authentication
    description: Session lifecycle for browser and native clients
  - name: Users
    description: Account management (admin only)
  - name: Memories
    description: Long-form Markdown documents with version history and internal references
  - name: Backups
    description: Server, library metadata, and media backups (admin only)
  - name: ML
    description: Local similarity search via perceptual hashing (admin for writes, per-file reads)
  - name: Libraries
    description: Register, adopt, refresh, and remove storage libraries; trigger and inspect indexing
  - name: Files
    description: Browse, upload, download, and operate on files, folders, and trash
  - name: Organization
    description: Tags, albums, and favorites
  - name: Search
    description: Full-text search over library content
  - name: Authorization
    description: Resource-based permissions and public share administration
  - name: Shares
    description: Anonymous access to public shares
security:
  - cookieAuth: []
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Report server liveness and dependency health
      description: >
        Pings the server database with a short timeout. Suitable for container
        health checks and orchestration probes. The endpoint returns 200 even
        when dependencies are down so probes can distinguish a live-but-degraded
        server from an unreachable one.
      security:
        - {}
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                ok:
                  value:
                    status: ok
                    database: ok
                degraded:
                  summary: Database unavailable, server still running
                  value:
                    status: degraded
                    database: error

  /version:
    get:
      tags: [System]
      operationId: getVersion
      summary: Report the running binary's build metadata
      security:
        - {}
      responses:
        '200':
          description: Build metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'

  /ready:
    get:
      tags: [System]
      operationId: getReady
      summary: Report whether the server is ready to serve traffic
      description: >
        Liveness (`/health`) asks whether the process is alive; readiness asks
        whether traffic should be routed here. Returns 200 only after startup
        completes and the database answers pings, and flips to 503 during
        graceful shutdown so load balancers and orchestrators drain
        connections to remaining instances.
      security:
        - {}
      responses:
        '200':
          description: Server is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          description: Server is not ready (starting, database down, or draining)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
            examples:
              draining:
                summary: Shutting down or database unreachable
                value:
                  status: unavailable
                  database: error

  /metrics:
    get:
      tags: [System]
      operationId: getMetrics
      summary: Render server metrics in Prometheus text format
      description: >
        Lightweight, dependency-free metrics in the Prometheus text exposition
        format: HTTP request counters (method + status), a request latency
        histogram, in-flight gauge, process uptime, and Go runtime gauges.
        Suitable for scraping by Prometheus, Grafana Agent, or curl-based
        checks. Restricted hosts may firewall this endpoint; it exposes
        operational counters only, never file or library content.
      security:
        - {}
      responses:
        '200':
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP cairn_http_requests_total Total HTTP requests by method and status code.
                # TYPE cairn_http_requests_total counter
                cairn_http_requests_total{method="GET",status="200"} 42

  /auth/status:
    get:
      tags: [Authentication]
      operationId: getAuthStatus
      summary: Report bootstrap and authentication state
      description: >
        Public. The web UI calls this on load to decide whether to show setup,
        login, or the application. `bootstrap_required` is true only when no
        account exists yet; `authenticated` reflects the optional session
        cookie. When authenticated, `user` is present.
      security:
        - {}
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'

  /auth/bootstrap:
    post:
      tags: [Authentication]
      operationId: bootstrap
      summary: Create the initial administrator account
      description: >
        Public, but only valid on a virgin server. Creates the first account
        (always admin) and starts a session. Once any account exists every
        further call is rejected with CONFLICT, so a provisioned server can be
        pointed at by attackers without yielding anything.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Admin account created and session started
          headers:
            Set-Cookie:
              description: The cairn_session cookie (HttpOnly, SameSite=Lax)
              schema:
                $ref: '#/components/schemas/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate with credentials and start a session
      description: >
        Public. Valid credentials start a session and set the cairn_session
        cookie. All failures — unknown username, wrong password, disabled
        account — return the same UNAUTHORIZED body so responses never reveal
        which part was wrong.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '200':
          description: Session started
          headers:
            Set-Cookie:
              description: The cairn_session cookie (HttpOnly, SameSite=Lax)
              schema:
                $ref: '#/components/schemas/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session
      description: >
        Requires a session cookie. Revokes the session server-side and clears
        the cookie. Idempotent.
      responses:
        '204':
          description: Session revoked and cookie cleared

  /auth/me:
    get:
      tags: [Authentication]
      operationId: currentUser
      summary: Return the authenticated principal
      description: Requires a session cookie.
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List user accounts
      description: Requires an admin session.
      responses:
        '200':
          description: All accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user account
      description: >
        Requires an admin session. `role` defaults to `user`; the only valid
        values are `admin` and `user`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{id}/sessions/revoke:
    post:
      tags: [Users]
      operationId: revokeUserSessions
      summary: Invalidate every session for a user
      description: >
        Requires an admin session. Rejects with NOT_FOUND when the account does
        not exist.
      parameters:
        - name: id
          in: path
          required: true
          description: User id (returned by user endpoints)
          schema:
            type: string
      responses:
        '204':
          description: All sessions for the user revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries:
    get:
      tags: [Libraries]
      operationId: listLibraries
      summary: List registered libraries
      description: Requires an admin session. Returns every registered library.
      responses:
        '200':
          description: Registered libraries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Libraries]
      operationId: createLibrary
      summary: Register a library (create or adopt)
      description: >
        Requires an admin session. Registers the absolute `path`. When the path
        already contains a `.cairn` metadata directory the library is adopted:
        the persistent identity, database, tags, albums, and index are reused and
        nothing is reprocessed. Otherwise fresh metadata is written. The response
        `mode` reports which happened. A root that is already registered or
        overlaps a registered root is rejected with CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryRequest'
      responses:
        '201':
          description: The registered library and how it was bound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryCreateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /libraries/probe:
    post:
      tags: [Libraries]
      operationId: probeLibrary
      summary: Inspect a candidate path without registering it
      description: >
        Requires an admin session. Read-only: reports whether the path exists, is
        a directory, is writable, already carries `.cairn` metadata, and is
        already registered. Non-existent paths are valid; they report
        `path_exists: false` instead of erroring.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryProbeRequest'
      responses:
        '200':
          description: Probe results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /libraries/{libraryID}:
    get:
      tags: [Libraries]
      operationId: getLibrary
      summary: Get a library by id
      description: >
        Requires an authenticated session with the `read` capability on the
        library. `status` reflects live connectivity of the backing storage.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      responses:
        '200':
          description: The library
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Libraries]
      operationId: deleteLibrary
      summary: Unregister a library
      description: >
        Requires an admin session. Removes the registration only; the `.cairn`
        metadata directory is left in place so the library can be re-adopted
        later. Content on disk is never modified.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      responses:
        '204':
          description: Library unregistered
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /libraries/{libraryID}/refresh:
    post:
      tags: [Libraries]
      operationId: refreshLibrary
      summary: Re-check connectivity or reconnect at a new path
      description: >
        Requires an admin session. With an empty body the last-known root is
        re-stat'd and `status` reconciled to `online`/`offline`. With `path`, the
        library is reconnected there; the new location must contain the same
        `.cairn` identity or the request is rejected with BAD_REQUEST.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: The reconciled library
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryID}/index:
    post:
      tags: [Libraries]
      operationId: triggerIndex
      summary: Enqueue an incremental index scan
      description: >
        Requires an admin session. Queues a background scan that reconciles the
        index with the filesystem using staged change detection (path, size,
        mod time; hashing only when necessary). Scans queue behind one another;
        repeating the call adds another scan. Offline libraries reject with
        CONFLICT.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      responses:
        '202':
          description: Scan queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexTriggerResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: The indexer is not available
  /libraries/{libraryID}/index/status:
    get:
      tags: [Libraries]
      operationId: indexStatus
      summary: Report index counts and the active scan job
      description: >
        Requires an admin session. Counts indexed files by status (present,
        missing, deleted) and, when a scan is queued or running, the job itself.
        A registered-but-never-scanned or offline library returns an empty status
        rather than an error.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      responses:
        '200':
          description: Index state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexStatusEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The indexer is not available

  /libraries/{libraryID}/search:
    get:
      tags: [Search]
      operationId: searchFiles
      summary: Search files in a library
      description: >
        Full-text search over indexed file paths and names. Plain terms are
        prefix-matched by default; quoted phrases, `AND`, `OR`, parentheses,
        and `-term`/`NOT term` exclusions are supported. Results combine with
        optional filters (media type, folder prefix, tag name, album, size
        range, mod_time range) and paginate with an opaque keyset cursor.
        Malformed expressions (unbalanced quotes or parens, dangling
        operators, "everything except X" negations) return 400 BAD_REQUEST.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: q
          in: query
          required: false
          description: Full-text search expression. Empty browses all files.
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Media type filter.
          schema:
            type: string
            enum: [photo, video, audio, document, other]
        - name: folder
          in: query
          required: false
          description: Folder path prefix filter.
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: Tag name filter (case-insensitive).
          schema:
            type: string
        - name: album
          in: query
          required: false
          description: Album id filter.
          schema:
            type: string
        - name: person
          in: query
          required: false
          description: >-
            Person id filter. Restricts results to files with a face assigned
            to the given person (Phase 15 face recognition).
          schema:
            type: string
        - name: min_size
          in: query
          required: false
          description: Minimum file size in bytes.
          schema:
            type: integer
            minimum: 0
        - name: max_size
          in: query
          required: false
          description: Maximum file size in bytes.
          schema:
            type: integer
            minimum: 0
        - name: from
          in: query
          required: false
          description: mod_time lower bound (RFC3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: mod_time upper bound (RFC3339).
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from a previous response.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of items to return (1-200, default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Matching files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListEnvelope'
        '400':
          description: Malformed query or impossible filter combination
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryID}/files:
    get:
      tags: [Files]
      operationId: listFiles
      summary: List files in a library (optionally inside a folder)
      description: >
        Requires an authenticated session with the `read` capability on the
        folder. Returns files with cursor pagination. Without `folder` only
        root-level files are returned unless `recursive=true`.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: folder
          in: query
          required: false
          description: Folder relative path; omit or use "." for the library root.
          schema:
            type: string
        - name: recursive
          in: query
          required: false
          description: When exactly "true", list all descendants instead of direct children.
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Media type filter.
          schema:
            type: string
            enum: [photo, video, audio, document, other]
        - name: status
          in: query
          required: false
          description: File status; defaults to `present`.
          schema:
            type: string
            enum: [present, missing, deleted]
        - name: sort
          in: query
          required: false
          description: Sort field; defaults to `name`.
          schema:
            type: string
            enum: [name, size, mod_time]
        - name: order
          in: query
          required: false
          description: Sort direction; defaults to `asc`.
          schema:
            type: string
            enum: [asc, desc]
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from a previous response's `next_cursor`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size (1-200, default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: A page of files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /libraries/{libraryID}/files/duplicates:
    get:
      tags: [Files]
      operationId: listDuplicates
      summary: List duplicate files grouped by content hash
      description: >
        Groups of present files that share a content hash (identical bytes),
        ordered by content hash. Missing, trashed, and un-hashed files are
        excluded. Groups are never split across pages. Requires the `read`
        capability on the library scope.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: cursor
          in: query
          required: false
          description: Content hash from a previous response's `next_cursor`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Max duplicate groups per page (1-200, default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: A page of duplicate groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicatesEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /libraries/{libraryID}/files/upload:
    post:
      tags: [Files]
      operationId: uploadFile
      summary: Upload a file into the library
      description: >
        Requires an authenticated session with the `create` capability on the
        destination folder. `multipart/form-data` with a `file` part and an
        optional `path` part (the destination relative path; the part's filename
        is used when omitted). Bytes are streamed to a temporary file and renamed
        into place atomically; a file already at the destination yields CONFLICT.
        Uploads are capped by server configuration (default 2 GiB).
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file bytes. Uploads are streamed, never buffered whole.
                path:
                  type: string
                  description: Destination relative path; falls back to the part's filename.
      responses:
        '201':
          description: The indexed file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Upload exceeds the configured maximum size
  /libraries/{libraryID}/files/{fileID}:
    get:
      tags: [Files]
      operationId: getFile
      summary: Get file metadata by id
      description: >
        Requires an authenticated session with the `read` capability on the file.
        The file must still exist on disk (`status: present`).
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: fileID
          in: path
          required: true
          description: File id (returned by file endpoints).
          schema:
            type: string
      responses:
        '200':
          description: File metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Files]
      operationId: trashFile
      summary: Move a file to the library trash (soft delete)
      description: >
        Requires an authenticated session with the `delete` capability on the
        file. The bytes move to `.cairn/trash/<fileID>` on the library; the
        index row, metadata, tags, and relationships are retained and the row
        keeps its original path. A file already in trash yields CONFLICT.
        Restore it with POST .../restore.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: fileID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '204':
          description: File moved to trash
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /libraries/{libraryID}/files/{fileID}/download:
    get:
      tags: [Files]
      operationId: downloadFile
      summary: Stream the original bytes of a file
      description: >
        Requires an authenticated session with the `download` capability on the
        file. Serves the original bytes from the library filesystem with
        `Content-Type` set to the file's detected MIME, `Content-Disposition:
        attachment`, and single-range `Range`/`If-Range`/`If-Modified-Since`
        support (206/304 responses). The body is streamed; it is never buffered.
        An optional `path` query parameter resolves by relative path first,
        falling back to `fileID`.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: fileID
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: false
          description: Relative path used as the primary lookup before `fileID`.
          schema:
            type: string
      responses:
        '200':
          description: The original file bytes (Content-Type is the file's MIME type)
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="IMG_0012.jpg"'
            Accept-Ranges:
              schema:
                type: string
                example: bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /libraries/{libraryID}/files/{fileID}/rename:
    post:
      tags: [Files]
      operationId: renameFile
      summary: Rename a file within its folder
      description: >
        Requires an authenticated session with the `edit` capability on the file.
        `new_name` must be a bare filename (no separators). A destination that
        already exists is rejected with CONFLICT.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: fileID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRequest'
      responses:
        '200':
          description: The renamed file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /libraries/{libraryID}/files/{fileID}/move:
    post:
      tags: [Files]
      operationId: moveFile
      summary: Move a file (may change folder and name)
      description: >
        Requires an authenticated session with the `move` capability on the file.
        `new_path` is the destination relative path; parent folders are created
        as needed. A destination that already exists is rejected with CONFLICT.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: fileID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
      responses:
        '200':
          description: The moved file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /libraries/{libraryID}/files/{fileID}/copy:
    post:
      tags: [Files]
      operationId: copyFile
      summary: Copy a file to a new path
      description: >
        Requires an authenticated session with the `read` capability on the
        source and the `create` capability on the destination folder. Bytes are
        streamed (32 KiB chunks) to a temporary file and renamed into place. The
        copy gets a new file id; a destination that already exists is rejected
        with CONFLICT.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: fileID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyRequest'
      responses:
        '201':
          description: The new copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /libraries/{libraryID}/files/{fileID}/restore:
    post:
      tags: [Files]
      operationId: restoreFile
      summary: Restore a file from the library trash
      description: >
        Requires an authenticated session with the `edit` capability on the file.
        Moves bytes back from `.cairn/trash/<fileID>` to the original path and
        marks the file `present`. A file not in trash, or whose original path is
        now occupied, yields CONFLICT.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: fileID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The restored file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /libraries/{libraryID}/files/{fileID}/permanent:
    delete:
      tags: [Files]
      operationId: permanentDeleteFile
      summary: Permanently delete a trashed file
      description: >
        Requires an authenticated session with the `delete` capability on the
        file. Irreversibly removes the trashed bytes and the index row. A file
        not in trash yields CONFLICT.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: fileID
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: File permanently deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /libraries/{libraryID}/files/{fileID}/metadata:
    get:
      tags: [Files]
      operationId: getFileMetadata
      summary: Get extracted media metadata for a file
      description: >
        Requires an authenticated session with the `read` capability on the file.
        Returns derived metadata (dimensions, duration, EXIF/GPS fields, thumbnail
        availability) extracted asynchronously by the media processor. Fields the
        extractor has not populated are omitted.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: fileID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Extracted metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetadataEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /libraries/{libraryID}/files/{fileID}/thumbnail:
    get:
      tags: [Files]
      operationId: getThumbnail
      summary: Get the derived thumbnail for a file
      description: >
        Requires an authenticated session with the `read` capability on the file.
        Returns a JPEG thumbnail (max 400 px on the longer side, quality 82) with
        Range support. Thumbnails are derived data under `.cairn/`; the original
        is never modified. Missing thumbnails are generated on demand when the
        file is a decodeable image; otherwise NOT_FOUND.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: fileID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: JPEG thumbnail bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /libraries/{libraryID}/folders:
    get:
      tags: [Files]
      operationId: listFolders
      summary: List the direct child folders of a folder
      description: >
        Requires an authenticated session with the `read` capability on the
        parent folder. Returns only direct children (one level, no recursion),
        ordered by name. `parent` is relative to the library root; omit or use
        "." for the root.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
