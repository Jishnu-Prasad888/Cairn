        - name: limit
          in: query
          required: false
          description: Maximum number of items to return (1-200, default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from a previous response.
          schema:
            type: string
      responses:
        '200':
          description: Memories in the library
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Memories]
      operationId: createMemory
      summary: Create a memory
      description: >
        Creates a memory and its first version. Any [[type:ID]] references in
        the body are parsed and persisted to the library reference index,
        enabling bidirectional navigation.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRequest'
      responses:
        '201':
          description: Memory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryID}/memories/{memoryID}:
    get:
      tags: [Memories]
      operationId: getMemory
      summary: Fetch one memory
      description: Returns the latest saved revision of the memory.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - $ref: '#/components/parameters/MemoryID'
      responses:
        '200':
          description: The memory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Memories]
      operationId: updateMemory
      summary: Save a new revision of a memory
      description: >
        Appends a new version rather than overwriting in place, so every save is
        retained and recoverable. References are re-parsed and the reference
        index is updated to match the new body.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - $ref: '#/components/parameters/MemoryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRequest'
      responses:
        '200':
          description: The updated memory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Memories]
      operationId: deleteMemory
      summary: Soft-delete a memory
      description: >
        Marks the memory deleted without removing its rows; versions and
        references are preserved so the memory can be restored.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - $ref: '#/components/parameters/MemoryID'
      responses:
        '204':
          description: Memory soft-deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryID}/memories/{memoryID}/restore:
    post:
      tags: [Memories]
      operationId: restoreMemory
      summary: Restore a soft-deleted memory
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - $ref: '#/components/parameters/MemoryID'
      responses:
        '204':
          description: Memory restored
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryID}/memories/{memoryID}/versions:
    get:
      tags: [Memories]
      operationId: listMemoryVersions
      summary: List the saved revisions of a memory
      description: Revisions are returned oldest first; the last entry is the current content.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - $ref: '#/components/parameters/MemoryID'
      responses:
        '200':
          description: Saved revisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryVersionListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryID}/memories/{memoryID}/versions/{version}:
    get:
      tags: [Memories]
      operationId: getMemoryVersion
      summary: Fetch one saved revision by number
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - $ref: '#/components/parameters/MemoryID'
        - name: version
          in: path
          required: true
          description: Revision number (>= 1)
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The requested revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryVersionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryID}/memories/{memoryID}/refs:
    get:
      tags: [Memories]
      operationId: listMemoryRefs
      summary: List the internal references parsed from a memory
      description: >
        Returns the [[type:ID]] references in the memory's body, enabling the UI
        to render links and bidirectional relations without reparsing Markdown.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - $ref: '#/components/parameters/MemoryID'
      responses:
        '200':
          description: Parsed references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRefListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryID}/permissions:
    get:
      tags: [Authorization]
      operationId: listGrants
      summary: List grants rooted in the library
      description: >
        Requires the `manage` capability on the library. Returns every grant
        whose resource key is the library or a descendant. Grants are
        resource-scoped (ADR-0005) and inherit down folders.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      responses:
        '200':
          description: Grants rooted in the library
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Authorization]
      operationId: createGrant
      summary: Grant capabilities on a resource to a user
      description: >
        Requires the `manage` capability on the library. The `key` is a
        resource key; a bare path is scoped to this library (folder keys gain
        the library prefix automatically). A grant on a container inherits down
        the hierarchy until a more specific `deny` overrides it.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRequest'
      responses:
        '201':
          description: The persisted grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /libraries/{libraryID}/permissions/{grantID}:
    delete:
      tags: [Authorization]
      operationId: revokeGrant
      summary: Revoke a grant
      description: >
        Requires the `manage` capability on the library and that the grant is
        rooted in it. Revocation is immediate: cached decisions are invalidated
        on the next evaluation.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: grantID
          in: path
          required: true
          description: Grant id (returned by the grant endpoints).
          schema:
            type: string
      responses:
        '204':
          description: Grant revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /libraries/{libraryID}/shares:
    get:
      tags: [Authorization]
      operationId: listShares
      summary: List shares rooted in the library
      description: >
        Requires the `manage` capability on the library. Returns share metadata
        only; the raw share token is shown once at creation and never again.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      responses:
        '200':
          description: Shares rooted in the library
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Authorization]
      operationId: createShare
      summary: Create a public share
      description: >
        Requires the `manage` capability on the library. The share scopes a set
        of capabilities to a resource key (library, folder, or entity) and is
        accessed anonymously with the returned token. The token is returned
        exactly once; only its SHA-256 digest is stored. An optional password
        and/or expiry gates access.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRequest'
      responses:
        '201':
          description: The share and its one-time token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /libraries/{libraryID}/shares/{shareID}:
    delete:
      tags: [Authorization]
      operationId: revokeShare
      summary: Revoke a public share
      description: >
        Requires the `manage` capability on the library and that the share is
        rooted in it. The token stops working immediately.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: shareID
          in: path
          required: true
          description: Share id (returned by the share endpoints).
          schema:
            type: string
      responses:
        '204':
          description: Share revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /shares/{token}:
    get:
      tags: [Shares]
      operationId: shareInfo
      summary: Inspect a public share
      description: >
        Public. Authenticates the share token (and optional password). Returns
        non-sensitive share metadata.
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          description: Share metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareInfoEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /shares/{token}/authenticate:
    post:
      tags: [Shares]
      operationId: authenticateShare
      summary: Confirm a share token and password
      description: >
        Public. Returns `{"authenticated": true}` when the token (and optional
        password) are valid. The UI calls this before navigating so it can
        prompt for a password up front.
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          description: Valid share token
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /shares/{token}/files:
    get:
      tags: [Shares]
      operationId: shareListFiles
      summary: List files inside the shared subtree
      description: >
        Public. Requires the `read` capability on the share for the requested
        folder. Results are filtered to the share's scope; a folder above the
        shared resource is forbidden.
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - name: folder
          in: query
          required: false
          description: Folder path (relative to the library). Omit for the library root.
          schema:
            type: string
      responses:
        '200':
          description: Files in the shared folder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /shares/{token}/files/{fileID}:
    get:
      tags: [Shares]
      operationId: shareGetFile
      summary: Get file metadata through a share
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - name: fileID
          in: path
          required: true
          description: File id.
          schema:
            type: string
      responses:
        '200':
          description: File metadata (only when the file is in the share scope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /shares/{token}/files/{fileID}/download:
    get:
      tags: [Shares]
      operationId: shareDownload
      summary: Download original bytes through a share
      description: >
        Public. Requires both `read` and `download` capabilities on the share for
        the file, and that the file is inside the share scope. Serves with Range
        support.
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - name: fileID
          in: path
          required: true
          description: File id.
          schema:
            type: string
      responses:
        '200':
          description: The original file bytes
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /backups:
    post:
      tags: [Backups]
      operationId: runBackup
      summary: Run a backup now
      description: >
        Admin only. Runs a full backup synchronously and returns the resulting
        record. Arguments are server-side (CAIRN_BACKUP_DIR, passphrase,
        retention); no per-call override is accepted. A run that is already in
        progress is refused with 409 Conflict.
      responses:
        '200':
          description: The backup record (usually completed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A backup is already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - cookieAuth: []
    get:
      tags: [Backups]
      operationId: listBackups
      summary: List recent backup records
      description: Admin only. Returns the most recent backup records, newest first.
      responses:
        '200':
          description: Recent backup records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BackupRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - cookieAuth: []

  /backups/{id}:
    get:
      tags: [Backups]
      operationId: getBackup
      summary: Get one backup record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The backup record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - cookieAuth: []

  /backups/{id}/verify:
    post:
      tags: [Backups]
      operationId: verifyBackup
      summary: Re-verify a completed backup
      description: >
        Admin only. Re-runs the sample verification over a completed backup,
        streaming back a bounded sample of entries and comparing plaintext
        hashes and sizes. Encrypted backups require the configured passphrase.
        Failures flip verify_status to `failed`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The record with updated verification fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRecord'
        '400':
          description: Backup not verifiable, or passphrase needed/mismatched
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - cookieAuth: []

  /backups/{id}/restore:
    post:
      tags: [Backups]
      operationId: restoreBackup
      summary: Restore a completed backup into a directory
      description: >
        Admin only. Streams every entry of a completed backup back to plaintext
        under the given destination, mirroring the stored layout and restoring
        original mtimes. The destination must be provided in the body.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination]
              properties:
                destination:
                  type: string
                  description: Absolute path where the backup is restored.
      responses:
        '200':
          description: Restored; the record is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRecord'
        '400':
          description: Missing or invalid destination, or wrong/missing passphrase
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - cookieAuth: []

  /libraries/{libraryID}/ml:
    get:
      tags: [ML]
      operationId: getMLStatus
      summary: Report the local similarity capability for a library
      description: >
        Admin only. Returns whether ML similarity is enabled, the active
        provider and version, the number of signatured files, and the distance
        threshold used to flag near-duplicates.
      parameters:
        - name: libraryID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ML status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Library is offline
      security:
        - cookieAuth: []

  /libraries/{libraryID}/ml/similarity/pass:
    post:
      tags: [ML]
      operationId: runSimilarityPass
      summary: Run a similarity pass over all present media files
      description: >
        Admin only. Computes perceptual signatures for every indexed file that
        lacks one and stores them as derived data. Runs in the background with
        bounded concurrency; the response reports that the pass has started.
      parameters:
        - name: libraryID
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Pass started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLPassResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Library is offline
      security:
        - cookieAuth: []

  /libraries/{libraryID}/ml/purge:
    post:
      tags: [ML]
      operationId: purgeMLSignatures
      summary: Delete all derived similarity signatures for a library
      description: >
        Admin only. Removes the derived signature data; originals are
        untouched and a later pass can regenerate it. Returns the number of
        purged rows.
      parameters:
        - name: libraryID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Purged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLPurgeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Library is offline
      security:
        - cookieAuth: []

  /libraries/{libraryID}/ml/faces:
    get:
      tags: [ML]
      operationId: getFaceStatus
      summary: Face recognition status for a library
      description: >
        Reports whether the face capability is enabled, the active provider
        and version, and the current face, person, and unassigned-face counts.
        Requires the Read capability like other read routes.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      responses:
        '200':
          description: Face status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLFaceStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Face recognition disabled or unavailable
      security:
        - cookieAuth: []

  /libraries/{libraryID}/ml/faces/pass:
    post:
      tags: [ML]
      operationId: runFacePass
      summary: Run a face detection pass
      description: >
        Admin only. Detects faces in photo files that lack a face row for the
        current provider/version and stores boxes plus appearance descriptors.
        Runs in the background; the response reports that the pass started.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      responses:
        '202':
          description: Pass started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLFacePassResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Face recognition disabled or unavailable
      security:
        - cookieAuth: []

  /libraries/{libraryID}/ml/faces/cluster:
    post:
      tags: [ML]
      operationId: runFaceCluster
      summary: Run a face clustering pass
      description: >
        Admin only. Groups unassigned faces into people by descriptor cosine
        similarity against per-person means. Runs in the background; the
        response reports that the pass started.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      responses:
        '202':
          description: Pass started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLFacePassResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Face recognition disabled or unavailable
      security:
        - cookieAuth: []

  /libraries/{libraryID}/ml/faces/purge:
    post:
      tags: [ML]
      operationId: purgeFaces
      summary: Delete all derived face data for a library
      description: >
        Admin only. Deletes every face and assignment. Originals and person
        names survive; a later pass can regenerate detection data.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      responses:
        '200':
          description: Purged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLFacePurgeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Face recognition disabled or unavailable
      security:
        - cookieAuth: []

  /libraries/{libraryID}/faces:
    get:
      tags: [ML]
      operationId: listUnassignedFaces
      summary: List unassigned faces (cluster pool)
      description: >
        Faces that no person is assigned to yet, without their descriptors.
        Requires the Read capability.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      responses:
        '200':
          description: Unassigned faces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacePool'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - cookieAuth: []

  /libraries/{libraryID}/faces/{faceID}/image:
    get:
      tags: [ML]
      operationId: getFaceImage
      summary: Serve a derived JPEG crop of a face
      description: >
        A downscaled JPEG crop of the face box from the source photo. Gated on
        read access to the owning file, like thumbnails.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: faceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: JPEG crop
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - cookieAuth: []

  /libraries/{libraryID}/people:
    get:
      tags: [ML]
      operationId: listPeople
      summary: List people and their face counts
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      responses:
        '200':
          description: People list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - cookieAuth: []
    post:
      tags: [ML]
      operationId: createPerson
      summary: Create a named person
      description: Requires the Create capability.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonNameChange'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - cookieAuth: []

  /libraries/{libraryID}/people/{personID}:
    get:
      tags: [ML]
      operationId: getPerson
      summary: Person detail with their assigned faces
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: personID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Person detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - cookieAuth: []
    delete:
      tags: [ML]
      operationId: deletePerson
      summary: Delete a person (their faces become unassigned)
      description: Requires the Delete capability.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: personID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - cookieAuth: []

  /libraries/{libraryID}/people/{personID}/rename:
    post:
      tags: [ML]
      operationId: renamePerson
      summary: Rename a person
      description: Requires the Edit capability.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: personID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonNameChange'
      responses:
        '200':
          description: Renamed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - cookieAuth: []

  /libraries/{libraryID}/people/{personID}/cover:
    post:
      tags: [ML]
      operationId: setPersonCover
      summary: Set which assigned face backs a person's cover thumbnail
      description: Requires the Edit capability.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: personID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [face_id]
              properties:
                face_id:
                  type: string
      responses:
        '200':
          description: Cover set
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - cookieAuth: []

  /libraries/{libraryID}/people/{personID}/merge:
    post:
      tags: [ML]
      operationId: mergePeople
      summary: Merge another person's faces into this person
      description: Requires the Edit capability.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: personID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_person_id]
              properties:
                source_person_id:
                  type: string
      responses:
        '200':
          description: Merged
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - cookieAuth: []

  /libraries/{libraryID}/people/{personID}/faces/{faceID}:
    post:
      tags: [ML]
      operationId: assignFace
      summary: Assign a face to a person
      description: Requires the Edit capability.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: personID
          in: path
          required: true
          schema:
            type: string
        - name: faceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Assigned
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - cookieAuth: []
    delete:
      tags: [ML]
      operationId: unassignFace
      summary: Unassign a face (it returns to the cluster pool)
      description: Requires the Edit capability.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: personID
          in: path
          required: true
          schema:
            type: string
        - name: faceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unassigned
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - cookieAuth: []

  /libraries/{libraryID}/files/{fileID}/similar:
    get:
      tags: [ML]
      operationId: findSimilarFiles
      summary: Find perceptually similar files in a library
      description: >
        Returns the files whose stored signature is within the configured
        distance of the given file's, ordered by proximity. Requires the same
        per-file Read capability as other content routes. Returns an empty
        list when ML is disabled or no pass has run yet.
      parameters:
        - name: libraryID
          in: path
          required: true
          schema:
            type: string
        - name: fileID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Similar files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarFilesResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - cookieAuth: []

components:
  parameters:
    LibraryID:
      name: libraryID
      in: path
      required: true
      description: Library id (returned by the library endpoints).
      schema:
        type: string
    MemoryID:
      name: memoryID
      in: path
      required: true
      description: Memory id (returned by the memory endpoints).
      schema:
        type: string
    RequestIdHeader:
      name: X-Request-ID
      in: header
      required: false
      description: >
        Client-provided request identifier echoed in the response header and in
        error bodies. Must be 1-128 chars of letters, digits, '-', '_', ':'.
      schema:
        type: string
    ShareToken:
      name: token
      in: path
      required: true
      description: >
        The raw share token returned once by createShare. Authenticates the
        share; a password-protected share also requires the `X-Cairn-Share-Password`
        header.
      schema:
        type: string
    SharePasswordHeader:
      name: X-Cairn-Share-Password
      in: header
      required: false
      description: >
        Optional password for a password-protected public share. Sent with every
        request to a share endpoint that gates a password.
      schema:
        type: string
  schemas:
    BackupRecord:
      type: object
      required: [id, status, destination, started_at, libraries, files, bytes, stored_bytes, created_at]
      properties:
        id:
          type: string
          description: Unique backup id.
        status:
          type: string
          enum: [running, completed, failed, pruned, restoring]
        destination:
          type: string
          description: Absolute path of the backup directory on the server.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        libraries:
          type: integer
        files:
          type: integer
        files_skipped:
          type: integer
          description: Media files reused from a previous backup (incremental).
        bytes:
          type: integer
          description: Total plaintext bytes backed up.
        stored_bytes:
          type: integer
          description: Total bytes on disk after codec (compression/encryption).
        encrypted:
          type: boolean
        same_device:
          type: boolean
          description: Destination is on the same filesystem as a source.
        verify_status:
          type: string
          enum: [ok, failed]
        verify_checked:
          type: integer
        verify_errors:
          type: integer
        error_msg:
          type: string
        created_at:
          type: string
          format: date-time
    ErrorBody:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: >
            Stable machine-readable error code. Clients branch on this value.
            See docs/api.md for the canonical list.
          example: NOT_FOUND
        message:
          type: string
          description: Human-readable message. May change; do not match on it.
          example: The requested resource was not found.
        details:
          type: object
          additionalProperties: true
          description: Optional structured context.
        request_id:
          type: string
          description: Correlates this error with server logs.
          example: b6f3329ae5c8f1d04c5a22e3a1b2c3d4
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    User:
      type: object
      required: [id, username, role, created_at]
      properties:
        id:
          type: string
          description: Stable opaque account id.
          example: 279674acccc95b5c
        username:
          type: string
          description: Unique (case-insensitive) login name.
          example: admin
        role:
          type: string
          enum: [admin, user]
          description: >
            Initial convenience role. Role checks are handled per-resource by the
            resource-based permission model.
        created_at:
          type: string
          format: date-time
          example: 2026-09-22T15:27:17.365651564Z
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    UserListEnvelope:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    UserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Login name; leading/trailing whitespace is trimmed.
        password:
          type: string
          minLength: 8
          maxLength: 1024
          description: >
            Plaintext password. Immutable transport requirement; see the
            security posture (TLS via reverse proxy).
        role:
          type: string
          enum: [admin, user]
          description: Only meaningful when creating users; ignored elsewhere.
    AuthStatus:
      type: object
      required: [bootstrap_required, authenticated]
      properties:
        bootstrap_required:
          type: boolean
          description: True only while no account exists.
          example: true
        authenticated:
          type: boolean
          description: Whether the request carried a valid session cookie.
          example: false
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          description: Present only when authenticated.
    SessionCookie:
      description: >
        Storage directive only; clients never read or send this value by hand —
        HTTP libraries manage the cookie jar. `cairn_session` is HttpOnly and
        SameSite=Lax, and carries the Secure flag when served over TLS.
      type: string
      example: cairn_session=…; Path=/; HttpOnly; SameSite=Lax; Max-Age=2592000
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Overall server status.
        database:
          type: string
          enum: [ok, error]
          description: Status of the server-level database check.
    Ready:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
          description: >
            `ready` when traffic may be routed here; `unavailable` while
            starting, when the database is unreachable, or during graceful
            shutdown.
        database:
          type: string
          enum: [ok, error]
          description: Status of the server-level database check.
    Version:
      type: object
      required: [version, commit, build_date, go_version, platform]
      properties:
        version:
          type: string
          description: Semantic version; "dev" for local builds.
          example: dev
        commit:
          type: string
          description: Git commit the binary was built from.
          example: 1a2b3c4
        build_date:
          type: string
          example: 2026-09-22T14:06:56Z
        go_version:
          type: string
          example: go1.26.4
        platform:
          type: string
          description: os/arch the binary was built for.
          example: linux/amd64
    Memory:
      type: object
      required: [id, title, body, deleted, created_at, updated_at]
      properties:
        id:
          type: string
          description: Stable opaque memory id.
          example: 1f4a8e2c9b6d7e3f
        title:
          type: string
          description: Display title shown in lists and link labels.
          example: Summer in Rye
        body:
          type: string
          description: Markdown body. See docs/markdown.md for the dialect.
        memory_date:
          type: string
          format: date-time
          description: Optional date the memory is about.
        deleted:
          type: boolean
          description: True after a soft delete and before a restore.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MemoryEnvelope:
      type: object
      required: [memory]
      properties:
        memory:
          $ref: '#/components/schemas/Memory'
    MemoryListEnvelope:
      type: object
      required: [memories]
      properties:
        memories:
          type: array
          items:
            $ref: '#/components/schemas/Memory'
        next_cursor:
          type: string
          description: >
            Present when more memories follow the returned page. Pass it back as
            `cursor` to fetch the next page.
    MemoryRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
          description: Leading/trailing whitespace is trimmed; must not be empty.
        body:
          type: string
          description: Markdown body.
        memory_date:
          type: string
          format: date-time
          description: Optional date the memory is about.
    MemoryVersion:
      type: object
      required: [memory_id, version, title, body, saved_at]
      properties:
        memory_id:
          type: string
        version:
          type: integer
          minimum: 1
          description: Monotonic revision number, starting at 1 on create.
        title:
          type: string
        body:
          type: string
        saved_at:
          type: string
          format: date-time
    MemoryVersionEnvelope:
      type: object
      required: [version]
      properties:
        version:
          $ref: '#/components/schemas/MemoryVersion'
    MemoryVersionListEnvelope:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/MemoryVersion'
    MemoryRef:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [media, memory, album, person, tag]
          description: Kind of referenced Cairn object.
        id:
          type: string
          description: Opaque id of the referenced object.
    MemoryRefListEnvelope:
      type: object
      required: [refs]
      properties:
        refs:
          type: array
          items:
            $ref: '#/components/schemas/MemoryRef'
    Capability:
      type: string
      enum: [read, download, create, edit, move, delete, share, manage]
      description: >
        A single operation a principal may perform on a resource. `manage` is the
        highest capability and implies administering permissions and shares on the
        resource.
    Effect:
      type: string
      enum: [allow, deny]
      description: >
        Whether a grant permits (`allow`) or forbids (`deny`) its capabilities.
        A `deny` on a more specific key beats any inherited `allow`.
    Grant:
      type: object
      required: [id, user_id, resource_key, capabilities, effect, created_at]
      properties:
        id:
          type: string
          description: Stable opaque grant id.
        user_id:
          type: string
          description: Account the grant applies to.
        resource_key:
          type: string
          description: >
            Resource key (ADR-0005). Examples: `lib-1` (library),
            `lib-1/f:2024` (folder), `lib-1/f:2024/x:img.jpg` (file),
            `lib-1/a:albumID` (entity). Grants inherit down the hierarchy.
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        effect:
          $ref: '#/components/schemas/Effect'
        created_at:
          type: string
          format: date-time
    GrantRequest:
      type: object
      required: [user_id, key, caps, effect]
      properties:
        user_id:
          type: string
          description: Account to grant. Must already exist.
        key:
          type: string
          description: >
            Resource key. A bare path (e.g. `2024/Japan`) is scoped to the
            library in the URL; a fully-qualified key of the same library is
            accepted as-is. Omit for the library itself.
        caps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Capability'
        effect:
          $ref: '#/components/schemas/Effect'
    GrantEnvelope:
      type: object
      required: [grant]
      properties:
        grant:
          $ref: '#/components/schemas/Grant'
    GrantListEnvelope:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
    Share:
      type: object
      required: [id, resource_key, capabilities, has_password, created_at]
      properties:
        id:
          type: string
        resource_key:
          type: string
          description: Resource the share scopes capabilities to.
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        has_password:
          type: boolean
          description: Whether the share requires a password.
        expires_at:
          type: string
          format: date-time
          description: Present until this instant, then the share is dead.
        revoked_at:
          type: string
          format: date-time
          description: Set once revoked; a revoked share is immediately dead.
        created_at:
          type: string
          format: date-time
    ShareRequest:
      type: object
      required: [key, caps]
      properties:
        key:
          type: string
          description: Resource key; bare paths are scoped to the library in the URL.
        caps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Capability'
        password:
          type: string
          description: Optional password (min 8 characters when set).
        expires_at:
          type: string
          format: date-time
          description: Optional RFC3339 expiry.
    ShareEnvelope:
      type: object
      required: [share, token]
      properties:
        share:
          $ref: '#/components/schemas/Share'
        token:
          type: string
          description: >
            The raw share token. Returned exactly once; only its digest is stored
            server-side. Present only on creation.
    ShareListEnvelope:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          items:
            $ref: '#/components/schemas/Share'
    ShareInfoEnvelope:
      type: object
      required: [share]
      properties:
        share:
          type: object
          required: [resource_key, library, has_password]
          properties:
            resource_key:
              type: string
            library:
              type: string
            has_password:
              type: boolean
            expires_at:
              type: string
              format: date-time
    File:
      type: object
      required: [id, library_id, rel_path, name, folder_path, size_bytes, mod_time, media_type, mime_type, status]
      properties:
        id:
          type: string
        library_id:
          type: string
        rel_path:
          type: string
        name:
          type: string
        folder_path:
          type: string
          description: Parent folder relative to the library root; empty for root files.
        size_bytes:
          type: integer
          format: int64
        mod_time:
          type: string
          format: date-time
        media_type:
          type: string
          enum: [photo, video, audio, document, other]
        mime_type:
          type: string
        status:
          type: string
          enum: [present, missing, deleted]
        content_hash:
          type: string
    FileEnvelope:
      type: object
      required: [file]
      properties:
        file:
          $ref: '#/components/schemas/File'
    FileListEnvelope:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
        next_cursor:
          type: string
        total:
          type: integer
    DuplicatesEnvelope:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/DuplicateGroup'
        next_cursor:
          type: string
          description: Content hash to continue from; empty on the last page.
        total:
          type: integer
          description: Total duplicate groups in the library (ignoring the cursor).
    DuplicateGroup:
      type: object
      required: [content_hash, size_bytes, files]
      properties:
        content_hash:
          type: string
          description: SHA-256 of the identical bytes shared by every member.
        size_bytes:
          type: integer
          description: Size of every member file (identical within a group).
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
    Library:
      type: object
      required: [id, name, root, status, schema_version, created_at, updated_at]
      properties:
        id:
          type: string
          description: Stable opaque library id.
        name:
          type: string
          description: Human-readable label chosen at registration.
        root:
          type: string
          description: Absolute filesystem path of the library root.
        status:
          type: string
          enum: [online, offline]
          description: >
            `online` when the backing storage is reachable at `root`; `offline`
            when it is not. Offline metadata stays browsable; media bytes are
            unavailable until the storage is reconnected.
        volume_id:
          type: string
          description: Filesystem volume identifier; absent when unknown.
        schema_version:
          type: integer
          description: Metadata schema version of the library.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LibraryEnvelope:
      type: object
      required: [library]
      properties:
        library:
          $ref: '#/components/schemas/Library'
    LibraryListEnvelope:
      type: object
      required: [libraries]
      properties:
        libraries:
          type: array
          items:
            $ref: '#/components/schemas/Library'
    LibraryRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Absolute path to register.
        name:
          type: string
          maxLength: 128
          description: Optional label; defaults to the directory base name.
    LibraryCreateResult:
      type: object
      required: [library, mode]
      properties:
        library:
          $ref: '#/components/schemas/Library'
        mode:
          type: string
          enum: [created, adopted]
          description: >
            `created` means fresh metadata was written; `adopted` means an
            existing `.cairn` metadata directory was bound and reused.
    LibraryProbeRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: >
            Absolute path to inspect. Non-existent paths are valid; they report
            `path_exists: false` instead of erroring.
    ProbeResult:
      type: object
      required: [path_exists, is_directory, is_writable, has_metadata, registered]
      properties:
        path_exists:
          type: boolean
        is_directory:
          type: boolean
        is_writable:
          type: boolean
        has_metadata:
          type: boolean
          description: A `.cairn` metadata directory already exists at the path.
        existing_id:
          type: string
          description: Existing library id when `has_metadata` is true.
        existing_name:
          type: string
          description: Existing library name when `has_metadata` is true.
        registered:
          type: boolean
          description: The path is already registered with this server.
        volume_id:
          type: string
          description: Filesystem volume identifier when determinable.
    ProbeResultEnvelope:
      type: object
      required: [probe]
      properties:
        probe:
          $ref: '#/components/schemas/ProbeResult'
    RefreshRequest:
      type: object
      description: An empty object `{}` re-checks the last-known root.
      properties:
        path:
          type: string
          description: >
            Optional new location to reconnect to; the new root must contain the
            same `.cairn` identity.
    IndexTriggerResult:
      type: object
      required: [job_id, library_id]
      properties:
        job_id:
          type: string
          description: Id of the enqueued index scan job.
        library_id:
          type: string
    IndexStatus:
      type: object
      required: [library_id, present, missing, deleted]
      properties:
        library_id:
          type: string
        present:
          type: integer
          description: Indexed files currently present on disk.
        missing:
          type: integer
          description: Indexed files whose bytes are currently unavailable.
        deleted:
          type: integer
          description: Indexed files in the library trash.
        active_job:
          $ref: '#/components/schemas/Job'
          description: The running (or next queued) scan job, when any.
        last_job_id:
          type: string
          description: Id of the most recent scan job, when any.
    IndexStatusEnvelope:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/IndexStatus'
    Job:
      type: object
      description: >
        Snapshot of a background job. Field names are as serialized by the
        server (the struct carries no JSON tags). `Status` is one of `queued`,
        `running`, `completed`, `failed`, `cancelled`; `Kind` is `index` or
        `process_media`.
      properties:
        ID:
          type: string
        Kind:
          type: string
        Status:
          type: string
        Priority:
          type: integer
        Payload:
          type: object
          additionalProperties: true
        Result:
          type: string
        ErrorMsg:
          type: string
        Attempt:
          type: integer
        MaxAttempts:
          type: integer
        CreatedAt:
          type: string
          format: date-time
        StartedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
        NextRunAt:
          type: string
          format: date-time
    Folder:
      type: object
      required: [id, library_id, rel_path, name, file_count]
      properties:
        id:
          type: string
        library_id:
          type: string
        rel_path:
          type: string
          description: Folder path relative to the library root.
        name:
          type: string
        file_count:
          type: integer
          description: Indexed count of files directly in the folder.
    FolderListEnvelope:
      type: object
      required: [folders]
      properties:
        folders:
          type: array
          items:
            $ref: '#/components/schemas/Folder'
    FileCollectionEnvelope:
      type: object
      required: [files]
      description: A plain, non-paginated file list (albums, trash, favorites).
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
    FileMetadata:
      type: object
      required: [file_id, has_thumbnail]
      properties:
        file_id:
          type: string
        media_type:
          type: string
          enum: [photo, video, audio, document, other]
        mime_type:
          type: string
        width:
          type: integer
          description: Pixel width; omitted when unknown.
        height:
          type: integer
          description: Pixel height; omitted when unknown.
        duration_secs:
          type: number
          format: double
          description: Duration for audio/video; omitted when unknown.
        taken_at:
          type: string
          format: date-time
          description: Capture time from EXIF; omitted when unknown.
        camera_make:
          type: string
        camera_model:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        has_thumbnail:
          type: boolean
        updated_at:
          type: string
          format: date-time
          description: Last time the extracted metadata was refreshed.
    FileMetadataEnvelope:
      type: object
      required: [metadata]
      properties:
        metadata:
          $ref: '#/components/schemas/FileMetadata'
    RenameRequest:
      type: object
      required: [path, new_name]
      properties:
        path:
          type: string
          description: Current relative path of the file.
        new_name:
          type: string
          description: New bare filename; must not contain separators.
    MoveRequest:
      type: object
      required: [path, new_path]
      properties:
        path:
          type: string
          description: Source relative path.
        new_path:
          type: string
          description: Destination relative path; may change folder and name.
    CopyRequest:
      type: object
      required: [path, dest_path]
      properties:
        path:
          type: string
          description: Source relative path.
        dest_path:
          type: string
          description: Destination relative path.
    DeleteRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Relative path of the file to move to trash.
    Tag:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
          description: Unique case-insensitively within the library.
        color:
          type: string
          description: Optional display color (free-form, e.g. a hex code).
        created_at:
          type: string
          format: date-time
    TagEnvelope:
      type: object
      required: [tag]
      properties:
        tag:
          $ref: '#/components/schemas/Tag'
    TagListEnvelope:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
    TagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Tag name; unique case-insensitively.
        color:
          type: string
          description: Optional display color.
    TagAttachRequest:
      type: object
      required: [tag_id]
      properties:
        tag_id:
          type: string
          description: Tag id (returned by tag endpoints).
    Album:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        cover_file_id:
          type: string
          description: File powering the cover thumbnail, when set.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AlbumEnvelope:
      type: object
      required: [album]
      properties:
        album:
          $ref: '#/components/schemas/Album'
    AlbumListEnvelope:
      type: object
      required: [albums]
      properties:
        albums:
          type: array
          items:
            $ref: '#/components/schemas/Album'
    AlbumRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
    MLStatus:
      type: object
      required: [library_id, enabled, provider, provider_version, signatured, distance_limit]
      properties:
        library_id:
          type: string
        enabled:
          type: boolean
          description: Whether ML similarity is enabled for this library.
        provider:
          type: string
          description: Active provider identifier (e.g. average_hash).
        provider_version:
          type: integer
          description: Provider algorithm version; signatures are versioned against it.
        signatured:
          type: integer
          description: Number of present files that already have a signature.
        distance_limit:
          type: integer
          description: Hamming distance threshold for flagging near-duplicates.
        last_pass_at:
          type: string
          format: date-time
          description: When the most recent pass began.
    MLPassResult:
      type: object
      required: [library_id, status]
      properties:
        library_id:
          type: string
        status:
          type: string
          description: Always "similarity pass started"; the pass runs in the background.
    MLPurgeResult:
      type: object
      required: [library_id, purged]
      properties:
        library_id:
          type: string
        purged:
          type: integer
          description: Number of signature rows deleted.
    SimilarFilesResult:
      type: object
      required: [similar]
      properties:
        similar:
          type: array
          description: Candidate files ordered by proximity (closest first).
          items:
            type: object
            required: [file_id, similarity]
            properties:
              file_id:
                type: string
              file_path:
                type: string
                description: Relative path within the library; empty if missing.
              distance:
                type: integer
                description: Hamming distance between signatures.
              similarity:
                type: number
                format: double
                description: Fraction of hash bits in common, 0..1.
    MLFaceStatus:
      type: object
      required: [enabled, provider, provider_version, faces, people, unassigned]
      properties:
        enabled:
          type: boolean
          description: Whether the face capability is on for this library.
        provider:
          type: string
          description: Active face provider identifier (e.g. pigo_appearance).
        provider_version:
          type: integer
          description: Provider algorithm version; faces are versioned against it.
        faces:
          type: integer
          description: Number of stored faces.
        people:
          type: integer
          description: Number of people.
        unassigned:
          type: integer
          description: Number of faces with no person assignment.
    MLFacePassResult:
      type: object
      required: [library_id, status]
      properties:
        library_id:
          type: string
        status:
          type: string
          description: Pass type that started (face detection / face clustering).
    MLFacePurgeResult:
      type: object
      required: [library_id, faces_removed]
      properties:
        library_id:
          type: string
        faces_removed:
          type: integer
          description: Number of face rows deleted.
    FaceSummary:
      type: object
      required: [id, file_id, x, y, width, height, confidence]
      properties:
        id:
          type: string
        file_id:
          type: string
        file_path:
          type: string
          description: Relative path within the library.
        x:
          type: number
          description: Box left, in source image pixels.
        y:
          type: number
          description: Box top, in source image pixels.
        width:
          type: number
        height:
          type: number
        confidence:
          type: number
          format: double
          description: Detector confidence, 0..1.
    FacePool:
      type: object
      required: [faces]
      properties:
        faces:
          type: array
          items:
            $ref: '#/components/schemas/FaceSummary'
    Person:
      type: object
      required: [id, name, face_count, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        cover_face_id:
          type: string
          description: Face powering the cover thumbnail, if any.
        cover_file_id:
          type: string
        face_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PeopleList:
      type: object
      required: [people]
      properties:
        people:
          type: array
          items:
            $ref: '#/components/schemas/Person'
    PersonResponse:
      type: object
      required: [person]
      properties:
        person:
          $ref: '#/components/schemas/Person'
    PersonDetail:
      type: object
      required: [person, faces]
      properties:
        person:
          $ref: '#/components/schemas/Person'
        faces:
          type: array
          items:
            $ref: '#/components/schemas/FaceSummary'
    PersonNameChange:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Non-empty person name.
  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, expired, or invalid session; or failed login
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not permitted (e.g. non-admin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The request conflicts with the current state (e.g. duplicate username or double bootstrap)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cairn_session
      description: >
        Opaque session token issued by /auth/login or /auth/bootstrap and stored
        in an HttpOnly, SameSite=Lax cookie. Only the SHA-256 digest is kept
        server-side; sessions expire after 30 days and are revoked on logout.
        By default every path requires this scheme; public endpoints declare
        `security: [{}]` explicitly.