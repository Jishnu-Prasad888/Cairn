            application/json:
              schema:
                $ref: '#/components/schemas/TagListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      tags: [Organization]
      operationId: createTag
      summary: Create a tag
      description: >
        Requires an authenticated session with the `create` capability on the
        library. Tag names are unique case-insensitively; a duplicate yields
        CONFLICT.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
      responses:
        '201':
          description: The created tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /libraries/{libraryID}/tags/{tagID}:
    delete:
      tags: [Organization]
      operationId: deleteTag
