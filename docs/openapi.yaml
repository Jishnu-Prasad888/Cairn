      responses:
        '200':
          description: Child folders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /libraries/{libraryID}/trash:
    get:
      tags: [Files]
      operationId: listTrash
      summary: List files in the library trash
      description: >
        Requires an authenticated session with the `read` capability on the
        library. Returns every trashed file with its original (pre-delete) path,
