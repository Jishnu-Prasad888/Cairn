openapi: 3.0.3
info:
  title: Cairn API
  version: 0.1.0
  description: >
    Cairn is a self-hosted personal media, file, and memory server. This
    specification is the complete contract for the HTTP API. A client (web app,
    React Native, desktop, CLI) can be built against this document alone.

    The API is versioned in the URL. Response bodies and error envelopes follow
    the conventions in docs/api.md — in particular every error is a JSON object
    of the shape defined by the ErrorResponse schema, and every response carries
    an X-Request-ID header.
  termsOfService: https://example.com/terms # placeholder until licensing is decided
  contact:
    name: Cairn
    url: https://github.com/Jishnu-Prasad888/Cairn
servers:
  - url: http://127.0.0.1:8715/api/v1
    description: Local default
tags:
  - name: System
    description: Liveness, versions, and server-wide metadata
  - name: Authentication
    description: Session lifecycle for browser and native clients
  - name: Users
    description: Account management (admin only)
  - name: Memories
    description: Long-form Markdown documents with version history and internal references
security:
  - cookieAuth: []
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Report server liveness and dependency health
      description: >
        Pings the server database with a short timeout. Suitable for container
        health checks and orchestration probes. The endpoint returns 200 even
        when dependencies are down so probes can distinguish a live-but-degraded
        server from an unreachable one.
      security:
        - {}
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                ok:
                  value:
                    status: ok
                    database: ok
                degraded:
                  summary: Database unavailable, server still running
                  value:
                    status: degraded
                    database: error

  /version:
    get:
      tags: [System]
      operationId: getVersion
      summary: Report the running binary's build metadata
      security:
        - {}
      responses:
        '200':
          description: Build metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'

  /auth/status:
    get:
      tags: [Authentication]
      operationId: getAuthStatus
      summary: Report bootstrap and authentication state
      description: >
        Public. The web UI calls this on load to decide whether to show setup,
        login, or the application. `bootstrap_required` is true only when no
        account exists yet; `authenticated` reflects the optional session
        cookie. When authenticated, `user` is present.
      security:
        - {}
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'

  /auth/bootstrap:
    post:
      tags: [Authentication]
      operationId: bootstrap
      summary: Create the initial administrator account
      description: >
        Public, but only valid on a virgin server. Creates the first account
        (always admin) and starts a session. Once any account exists every
        further call is rejected with CONFLICT, so a provisioned server can be
        pointed at by attackers without yielding anything.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Admin account created and session started
          headers:
            Set-Cookie:
              description: The cairn_session cookie (HttpOnly, SameSite=Lax)
              schema:
                $ref: '#/components/schemas/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate with credentials and start a session
      description: >
        Public. Valid credentials start a session and set the cairn_session
        cookie. All failures — unknown username, wrong password, disabled
        account — return the same UNAUTHORIZED body so responses never reveal
        which part was wrong.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '200':
          description: Session started
          headers:
            Set-Cookie:
              description: The cairn_session cookie (HttpOnly, SameSite=Lax)
              schema:
                $ref: '#/components/schemas/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session
      description: >
        Requires a session cookie. Revokes the session server-side and clears
        the cookie. Idempotent.
      responses:
        '204':
          description: Session revoked and cookie cleared

  /auth/me:
    get:
      tags: [Authentication]
      operationId: currentUser
      summary: Return the authenticated principal
      description: Requires a session cookie.
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List user accounts
      description: Requires an admin session.
      responses:
        '200':
          description: All accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user account
      description: >
        Requires an admin session. `role` defaults to `user`; the only valid
        values are `admin` and `user`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{id}/sessions/revoke:
    post:
      tags: [Users]
      operationId: revokeUserSessions
      summary: Invalidate every session for a user
      description: >
        Requires an admin session. Rejects with NOT_FOUND when the account does
        not exist.
      parameters:
        - name: id
          in: path
          required: true
          description: User id (returned by user endpoints)
          schema:
            type: string
      responses:
        '204':
          description: All sessions for the user revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryID}/search:
    get:
      tags: [Search]
      operationId: searchFiles
      summary: Search files in a library
      description: >
        Full-text search over indexed file paths and names. Plain terms are
        prefix-matched by default; quoted phrases, `AND`, `OR`, parentheses,
        and `-term`/`NOT term` exclusions are supported. Results combine with
        optional filters (media type, folder prefix, tag name, album, size
        range, mod_time range) and paginate with an opaque keyset cursor.
        Malformed expressions (unbalanced quotes or parens, dangling
        operators, "everything except X" negations) return 400 BAD_REQUEST.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: q
          in: query
          required: false
          description: Full-text search expression. Empty browses all files.
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Media type filter.
          schema:
            type: string
            enum: [photo, video, audio, document, other]
        - name: folder
          in: query
          required: false
          description: Folder path prefix filter.
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: Tag name filter (case-insensitive).
          schema:
            type: string
        - name: album
          in: query
          required: false
          description: Album id filter.
          schema:
            type: string
        - name: min_size
          in: query
          required: false
          description: Minimum file size in bytes.
          schema:
            type: integer
            minimum: 0
        - name: max_size
          in: query
          required: false
          description: Maximum file size in bytes.
          schema:
            type: integer
            minimum: 0
        - name: from
          in: query
          required: false
          description: mod_time lower bound (RFC3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: mod_time upper bound (RFC3339).
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from a previous response.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of items to return (1-200, default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Matching files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListEnvelope'
        '400':
          description: Malformed query or impossible filter combination
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryID}/memories:
    get:
      tags: [Memories]
      operationId: listMemories
      summary: List memories in a library
      description: >
        Lists memories ordered by most recently updated, newest first. Soft
        deleted memories are excluded. Set `q` to search titles and bodies via
        the library full-text index. Keyset pagination is available with the
        `cursor` parameter; the response includes `next_cursor` while more
        results remain.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: q
          in: query
          required: false
          description: Full-text search query over memory titles and bodies.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of items to return (1-200, default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from a previous response.
          schema:
            type: string
      responses:
        '200':
          description: Memories in the library
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Memories]
      operationId: createMemory
      summary: Create a memory
      description: >
        Creates a memory and its first version. Any [[type:ID]] references in
        the body are parsed and persisted to the library reference index,
        enabling bidirectional navigation.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRequest'
      responses:
        '201':
          description: Memory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryID}/memories/{memoryID}:
    get:
      tags: [Memories]
      operationId: getMemory
      summary: Fetch one memory
      description: Returns the latest saved revision of the memory.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - $ref: '#/components/parameters/MemoryID'
      responses:
        '200':
          description: The memory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Memories]
      operationId: updateMemory
      summary: Save a new revision of a memory
      description: >
        Appends a new version rather than overwriting in place, so every save is
        retained and recoverable. References are re-parsed and the reference
        index is updated to match the new body.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - $ref: '#/components/parameters/MemoryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRequest'
      responses:
        '200':
          description: The updated memory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Memories]
      operationId: deleteMemory
      summary: Soft-delete a memory
      description: >
        Marks the memory deleted without removing its rows; versions and
        references are preserved so the memory can be restored.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - $ref: '#/components/parameters/MemoryID'
      responses:
        '204':
          description: Memory soft-deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryID}/memories/{memoryID}/restore:
    post:
      tags: [Memories]
      operationId: restoreMemory
      summary: Restore a soft-deleted memory
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - $ref: '#/components/parameters/MemoryID'
      responses:
        '204':
          description: Memory restored
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryID}/memories/{memoryID}/versions:
    get:
      tags: [Memories]
      operationId: listMemoryVersions
      summary: List the saved revisions of a memory
      description: Revisions are returned oldest first; the last entry is the current content.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - $ref: '#/components/parameters/MemoryID'
      responses:
        '200':
          description: Saved revisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryVersionListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryID}/memories/{memoryID}/versions/{version}:
    get:
      tags: [Memories]
      operationId: getMemoryVersion
      summary: Fetch one saved revision by number
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - $ref: '#/components/parameters/MemoryID'
        - name: version
          in: path
          required: true
          description: Revision number (>= 1)
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The requested revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryVersionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryID}/memories/{memoryID}/refs:
    get:
      tags: [Memories]
      operationId: listMemoryRefs
      summary: List the internal references parsed from a memory
      description: >
        Returns the [[type:ID]] references in the memory's body, enabling the UI
        to render links and bidirectional relations without reparsing Markdown.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - $ref: '#/components/parameters/MemoryID'
      responses:
        '200':
          description: Parsed references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRefListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryID}/permissions:
    get:
      tags: [Authorization]
      operationId: listGrants
      summary: List grants rooted in the library
      description: >
        Requires the `manage` capability on the library. Returns every grant
        whose resource key is the library or a descendant. Grants are
        resource-scoped (ADR-0005) and inherit down folders.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      responses:
        '200':
          description: Grants rooted in the library
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Authorization]
      operationId: createGrant
      summary: Grant capabilities on a resource to a user
      description: >
        Requires the `manage` capability on the library. The `key` is a
        resource key; a bare path is scoped to this library (folder keys gain
        the library prefix automatically). A grant on a container inherits down
        the hierarchy until a more specific `deny` overrides it.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRequest'
      responses:
        '201':
          description: The persisted grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /libraries/{libraryID}/permissions/{grantID}:
    delete:
      tags: [Authorization]
      operationId: revokeGrant
      summary: Revoke a grant
      description: >
        Requires the `manage` capability on the library and that the grant is
        rooted in it. Revocation is immediate: cached decisions are invalidated
        on the next evaluation.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: grantID
          in: path
          required: true
          description: Grant id (returned by the grant endpoints).
          schema:
            type: string
      responses:
        '204':
          description: Grant revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /libraries/{libraryID}/shares:
    get:
      tags: [Authorization]
      operationId: listShares
      summary: List shares rooted in the library
      description: >
        Requires the `manage` capability on the library. Returns share metadata
        only; the raw share token is shown once at creation and never again.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      responses:
        '200':
          description: Shares rooted in the library
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Authorization]
      operationId: createShare
      summary: Create a public share
      description: >
        Requires the `manage` capability on the library. The share scopes a set
        of capabilities to a resource key (library, folder, or entity) and is
        accessed anonymously with the returned token. The token is returned
        exactly once; only its SHA-256 digest is stored. An optional password
        and/or expiry gates access.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRequest'
      responses:
        '201':
          description: The share and its one-time token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /libraries/{libraryID}/shares/{shareID}:
    delete:
      tags: [Authorization]
      operationId: revokeShare
      summary: Revoke a public share
      description: >
        Requires the `manage` capability on the library and that the share is
        rooted in it. The token stops working immediately.
      parameters:
        - $ref: '#/components/parameters/LibraryID'
        - name: shareID
          in: path
          required: true
          description: Share id (returned by the share endpoints).
          schema:
            type: string
      responses:
        '204':
          description: Share revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /shares/{token}:
    get:
      tags: [Shares]
      operationId: shareInfo
      summary: Inspect a public share
      description: >
        Public. Authenticates the share token (and optional password). Returns
        non-sensitive share metadata.
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          description: Share metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareInfoEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /shares/{token}/authenticate:
    post:
      tags: [Shares]
      operationId: authenticateShare
      summary: Confirm a share token and password
      description: >
        Public. Returns `{"authenticated": true}` when the token (and optional
        password) are valid. The UI calls this before navigating so it can
        prompt for a password up front.
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          description: Valid share token
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /shares/{token}/files:
    get:
      tags: [Shares]
      operationId: shareListFiles
      summary: List files inside the shared subtree
      description: >
        Public. Requires the `read` capability on the share for the requested
        folder. Results are filtered to the share's scope; a folder above the
        shared resource is forbidden.
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - name: folder
          in: query
          required: false
          description: Folder path (relative to the library). Omit for the library root.
          schema:
            type: string
      responses:
        '200':
          description: Files in the shared folder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /shares/{token}/files/{fileID}:
    get:
      tags: [Shares]
      operationId: shareGetFile
      summary: Get file metadata through a share
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - name: fileID
          in: path
          required: true
          description: File id.
          schema:
            type: string
      responses:
        '200':
          description: File metadata (only when the file is in the share scope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /shares/{token}/files/{fileID}/download:
    get:
      tags: [Shares]
      operationId: shareDownload
      summary: Download original bytes through a share
      description: >
        Public. Requires both `read` and `download` capabilities on the share for
        the file, and that the file is inside the share scope. Serves with Range
        support.
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - name: fileID
          in: path
          required: true
          description: File id.
          schema:
            type: string
      responses:
        '200':
          description: The original file bytes
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  
components:
  schemas:
    ErrorBody:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: >
            Stable machine-readable error code. Clients branch on this value.
            See docs/api.md for the canonical list.
          example: NOT_FOUND
        message:
          type: string
          description: Human-readable message. May change; do not match on it.
          example: The requested resource was not found.
        details:
          type: object
          additionalProperties: true
          description: Optional structured context.
        request_id:
          type: string
          description: Correlates this error with server logs.
          example: b6f3329ae5c8f1d04c5a22e3a1b2c3d4
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    User:
      type: object
      required: [id, username, role, created_at]
      properties:
        id:
          type: string
          description: Stable opaque account id.
          example: 279674acccc95b5c
        username:
          type: string
          description: Unique (case-insensitive) login name.
          example: admin
        role:
          type: string
          enum: [admin, user]
          description: >
            Initial convenience role. Role checks are handled per-resource by the
            resource-based permission model.
        created_at:
          type: string
          format: date-time
          example: 2026-09-22T15:27:17.365651564Z
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    UserListEnvelope:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    UserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Login name; leading/trailing whitespace is trimmed.
        password:
          type: string
          minLength: 8
          maxLength: 1024
          description: >
            Plaintext password. Immutable transport requirement; see the
            security posture (TLS via reverse proxy).
        role:
          type: string
          enum: [admin, user]
          description: Only meaningful when creating users; ignored elsewhere.
    AuthStatus:
      type: object
      required: [bootstrap_required, authenticated]
      properties:
        bootstrap_required:
          type: boolean
          description: True only while no account exists.
          example: true
        authenticated:
          type: boolean
          description: Whether the request carried a valid session cookie.
          example: false
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          description: Present only when authenticated.
    SessionCookie:
      description: >
        Storage directive only; clients never read or send this value by hand —
        HTTP libraries manage the cookie jar. `cairn_session` is HttpOnly and
        SameSite=Lax, and carries the Secure flag when served over TLS.
      type: string
      example: cairn_session=…; Path=/; HttpOnly; SameSite=Lax; Max-Age=2592000
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Overall server status.
        database:
          type: string
          enum: [ok, error]
          description: Status of the server-level database check.
    Version:
      type: object
      required: [version, commit, build_date, go_version, platform]
      properties:
        version:
          type: string
          description: Semantic version; "dev" for local builds.
          example: dev
        commit:
          type: string
          description: Git commit the binary was built from.
          example: 1a2b3c4
        build_date:
          type: string
          example: 2026-09-22T14:06:56Z
        go_version:
          type: string
          example: go1.26.4
        platform:
          type: string
          description: os/arch the binary was built for.
          example: linux/amd64
    Memory:
      type: object
      required: [id, title, body, deleted, created_at, updated_at]
      properties:
        id:
          type: string
          description: Stable opaque memory id.
          example: 1f4a8e2c9b6d7e3f
        title:
          type: string
          description: Display title shown in lists and link labels.
          example: Summer in Rye
        body:
          type: string
          description: Markdown body. See docs/markdown.md for the dialect.
        memory_date:
          type: string
          format: date-time
          description: Optional date the memory is about.
        deleted:
          type: boolean
          description: True after a soft delete and before a restore.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MemoryEnvelope:
      type: object
      required: [memory]
      properties:
        memory:
          $ref: '#/components/schemas/Memory'
    MemoryListEnvelope:
      type: object
      required: [memories]
      properties:
        memories:
          type: array
          items:
            $ref: '#/components/schemas/Memory'
        next_cursor:
          type: string
          description: >
            Present when more memories follow the returned page. Pass it back as
            `cursor` to fetch the next page.
    MemoryRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
          description: Leading/trailing whitespace is trimmed; must not be empty.
        body:
          type: string
          description: Markdown body.
        memory_date:
          type: string
          format: date-time
          description: Optional date the memory is about.
    MemoryVersion:
      type: object
      required: [memory_id, version, title, body, saved_at]
      properties:
        memory_id:
          type: string
        version:
          type: integer
          minimum: 1
          description: Monotonic revision number, starting at 1 on create.
        title:
          type: string
        body:
          type: string
        saved_at:
          type: string
          format: date-time
    MemoryVersionEnvelope:
      type: object
      required: [version]
      properties:
        version:
          $ref: '#/components/schemas/MemoryVersion'
    MemoryVersionListEnvelope:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/MemoryVersion'
    MemoryRef:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [media, memory, album, person, tag]
          description: Kind of referenced Cairn object.
        id:
          type: string
          description: Opaque id of the referenced object.
    MemoryRefListEnvelope:
      type: object
      required: [refs]
      properties:
        refs:
          type: array
          items:
            $ref: '#/components/schemas/MemoryRef'
    Capability:
      type: string
      enum: [read, download, create, edit, move, delete, share, manage]
      description: >
        A single operation a principal may perform on a resource. `manage` is the
        highest capability and implies administering permissions and shares on the
        resource.
    Effect:
      type: string
      enum: [allow, deny]
      description: >
        Whether a grant permits (`allow`) or forbids (`deny`) its capabilities.
        A `deny` on a more specific key beats any inherited `allow`.
    Grant:
      type: object
      required: [id, user_id, resource_key, capabilities, effect, created_at]
      properties:
        id:
          type: string
          description: Stable opaque grant id.
        user_id:
          type: string
          description: Account the grant applies to.
        resource_key:
          type: string
          description: >
            Resource key (ADR-0005). Examples: `lib-1` (library),
            `lib-1/f:2024` (folder), `lib-1/f:2024/x:img.jpg` (file),
            `lib-1/a:albumID` (entity). Grants inherit down the hierarchy.
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        effect:
          $ref: '#/components/schemas/Effect'
        created_at:
          type: string
          format: date-time
    GrantRequest:
      type: object
      required: [user_id, key, caps, effect]
      properties:
        user_id:
          type: string
          description: Account to grant. Must already exist.
        key:
          type: string
          description: >
            Resource key. A bare path (e.g. `2024/Japan`) is scoped to the
            library in the URL; a fully-qualified key of the same library is
            accepted as-is. Omit for the library itself.
        caps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Capability'
        effect:
          $ref: '#/components/schemas/Effect'
    GrantEnvelope:
      type: object
      required: [grant]
      properties:
        grant:
          $ref: '#/components/schemas/Grant'
    GrantListEnvelope:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
    Share:
      type: object
      required: [id, resource_key, capabilities, has_password, created_at]
      properties:
        id:
          type: string
        resource_key:
          type: string
          description: Resource the share scopes capabilities to.
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        has_password:
          type: boolean
          description: Whether the share requires a password.
        expires_at:
          type: string
          format: date-time
          description: Present until this instant, then the share is dead.
        revoked_at:
          type: string
          format: date-time
          description: Set once revoked; a revoked share is immediately dead.
        created_at:
          type: string
          format: date-time
    ShareRequest:
      type: object
      required: [key, caps]
      properties:
        key:
          type: string
          description: Resource key; bare paths are scoped to the library in the URL.
        caps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Capability'
        password:
          type: string
          description: Optional password (min 8 characters when set).
        expires_at:
          type: string
          format: date-time
          description: Optional RFC3339 expiry.
    ShareEnvelope:
      type: object
      required: [share, token]
      properties:
        share:
          $ref: '#/components/schemas/Share'
        token:
          type: string
          description: >
            The raw share token. Returned exactly once; only its digest is stored
            server-side. Present only on creation.
    ShareListEnvelope:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          items:
            $ref: '#/components/schemas/Share'
    ShareInfoEnvelope:
      type: object
      required: [share]
      properties:
        share:
          type: object
          required: [resource_key, library, has_password]
          properties:
            resource_key:
              type: string
            library:
              type: string
            has_password:
              type: boolean
            expires_at:
              type: string
              format: date-time
    File:
      type: object
      required: [id, library_id, rel_path, name, folder_path, size_bytes, mod_time, media_type, mime_type, status]
      properties:
        id:
          type: string
        library_id:
          type: string
        rel_path:
          type: string
        name:
          type: string
        folder_path:
          type: string
          description: Parent folder relative to the library root; empty for root files.
        size_bytes:
          type: integer
          format: int64
        mod_time:
          type: string
          format: date-time
        media_type:
          type: string
          enum: [photo, video, audio, document, other]
        mime_type:
          type: string
        status:
          type: string
          enum: [present, missing, deleted]
        content_hash:
          type: string
    FileEnvelope:
      type: object
      required: [file]
      properties:
        file:
          $ref: '#/components/schemas/File'
    FileListEnvelope:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
        next_cursor:
          type: string
        total:
          type: integer
  parameters:
    LibraryID:
      name: libraryID
      in: path
      required: true
      description: Library id (returned by the library endpoints).
      schema:
        type: string
    MemoryID:
      name: memoryID
      in: path
      required: true
      description: Memory id (returned by the memory endpoints).
      schema:
        type: string
    RequestIdHeader:
      name: X-Request-ID
      in: header
      required: false
      description: >
        Client-provided request identifier echoed in the response header and in
        error bodies. Must be 1-128 chars of letters, digits, '-', '_', ':'.
      schema:
        type: string
    ShareToken:
      name: token
      in: path
      required: true
      description: >
        The raw share token returned once by createShare. Authenticates the
        share; a password-protected share also requires the `X-Cairn-Share-Password`
        header.
      schema:
        type: string
    SharePasswordHeader:
      name: X-Cairn-Share-Password
      in: header
      required: false
      description: >
        Optional password for a password-protected public share. Sent with every
        request to a share endpoint that gates a password.
      schema:
        type: string
  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, expired, or invalid session; or failed login
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not permitted (e.g. non-admin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The request conflicts with the current state (e.g. duplicate username or double bootstrap)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cairn_session
      description: >
        Opaque session token issued by /auth/login or /auth/bootstrap and stored
        in an HttpOnly, SameSite=Lax cookie. Only the SHA-256 digest is kept
        server-side; sessions expire after 30 days and are revoked on logout.
        By default every path requires this scheme; public endpoints declare
        `security: [{}]` explicitly.