openapi: 3.0.3
info:
  title: Cairn API
  version: 0.1.0
  description: >
    Cairn is a self-hosted personal media, file, and memory server. This
    specification is the complete contract for the HTTP API. A client (web app,
    React Native, desktop, CLI) can be built against this document alone.

    The API is versioned in the URL. Response bodies and error envelopes follow
    the conventions in docs/api.md — in particular every error is a JSON object
    of the shape defined by the ErrorResponse schema, and every response carries
    an X-Request-ID header.
  termsOfService: https://example.com/terms # placeholder until licensing is decided
  contact:
    name: Cairn
    url: https://github.com/Jishnu-Prasad888/Cairn
servers:
  - url: http://127.0.0.1:8715/api/v1
    description: Local default
tags:
  - name: System
    description: Liveness, versions, and server-wide metadata
  - name: Authentication
    description: Session lifecycle for browser and native clients
  - name: Users
    description: Account management (admin only)
security:
  - cookieAuth: []
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Report server liveness and dependency health
      description: >
        Pings the server database with a short timeout. Suitable for container
        health checks and orchestration probes. The endpoint returns 200 even
        when dependencies are down so probes can distinguish a live-but-degraded
        server from an unreachable one.
      security:
        - {}
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                ok:
                  value:
                    status: ok
                    database: ok
                degraded:
                  summary: Database unavailable, server still running
                  value:
                    status: degraded
                    database: error

  /version:
    get:
      tags: [System]
      operationId: getVersion
      summary: Report the running binary's build metadata
      security:
        - {}
      responses:
        '200':
          description: Build metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'

  /auth/status:
    get:
      tags: [Authentication]
      operationId: getAuthStatus
      summary: Report bootstrap and authentication state
      description: >
        Public. The web UI calls this on load to decide whether to show setup,
        login, or the application. `bootstrap_required` is true only when no
        account exists yet; `authenticated` reflects the optional session
        cookie. When authenticated, `user` is present.
      security:
        - {}
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'

  /auth/bootstrap:
    post:
      tags: [Authentication]
      operationId: bootstrap
      summary: Create the initial administrator account
      description: >
        Public, but only valid on a virgin server. Creates the first account
        (always admin) and starts a session. Once any account exists every
        further call is rejected with CONFLICT, so a provisioned server can be
        pointed at by attackers without yielding anything.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Admin account created and session started
          headers:
            Set-Cookie:
              description: The cairn_session cookie (HttpOnly, SameSite=Lax)
              schema:
                $ref: '#/components/schemas/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate with credentials and start a session
      description: >
        Public. Valid credentials start a session and set the cairn_session
        cookie. All failures — unknown username, wrong password, disabled
        account — return the same UNAUTHORIZED body so responses never reveal
        which part was wrong.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '200':
          description: Session started
          headers:
            Set-Cookie:
              description: The cairn_session cookie (HttpOnly, SameSite=Lax)
              schema:
                $ref: '#/components/schemas/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session
      description: >
        Requires a session cookie. Revokes the session server-side and clears
        the cookie. Idempotent.
      responses:
        '204':
          description: Session revoked and cookie cleared

  /auth/me:
    get:
      tags: [Authentication]
      operationId: currentUser
      summary: Return the authenticated principal
      description: Requires a session cookie.
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List user accounts
      description: Requires an admin session.
      responses:
        '200':
          description: All accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user account
      description: >
        Requires an admin session. `role` defaults to `user`; the only valid
        values are `admin` and `user`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{id}/sessions/revoke:
    post:
      tags: [Users]
      operationId: revokeUserSessions
      summary: Invalidate every session for a user
      description: >
        Requires an admin session. Rejects with NOT_FOUND when the account does
        not exist.
      parameters:
        - name: id
          in: path
          required: true
          description: User id (returned by user endpoints)
          schema:
            type: string
      responses:
        '204':
          description: All sessions for the user revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    ErrorBody:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: >
            Stable machine-readable error code. Clients branch on this value.
            See docs/api.md for the canonical list.
          example: NOT_FOUND
        message:
          type: string
          description: Human-readable message. May change; do not match on it.
          example: The requested resource was not found.
        details:
          type: object
          additionalProperties: true
          description: Optional structured context.
        request_id:
          type: string
          description: Correlates this error with server logs.
          example: b6f3329ae5c8f1d04c5a22e3a1b2c3d4
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    User:
      type: object
      required: [id, username, role, created_at]
      properties:
        id:
          type: string
          description: Stable opaque account id.
          example: 279674acccc95b5c
        username:
          type: string
          description: Unique (case-insensitive) login name.
          example: admin
        role:
          type: string
          enum: [admin, user]
          description: >
            Initial convenience role. Phase 9 replaces role checks with the
            resource-based permission model.
        created_at:
          type: string
          format: date-time
          example: 2026-09-22T15:27:17.365651564Z
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    UserListEnvelope:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    UserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Login name; leading/trailing whitespace is trimmed.
        password:
          type: string
          minLength: 8
          maxLength: 1024
          description: >
            Plaintext password. Immutable transport requirement; see the
            security posture (TLS via reverse proxy).
        role:
          type: string
          enum: [admin, user]
          description: Only meaningful when creating users; ignored elsewhere.
    AuthStatus:
      type: object
      required: [bootstrap_required, authenticated]
      properties:
        bootstrap_required:
          type: boolean
          description: True only while no account exists.
          example: true
        authenticated:
          type: boolean
          description: Whether the request carried a valid session cookie.
          example: false
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          description: Present only when authenticated.
    SessionCookie:
      description: >
        Storage directive only; clients never read or send this value by hand —
        HTTP libraries manage the cookie jar. `cairn_session` is HttpOnly and
        SameSite=Lax, and carries the Secure flag when served over TLS.
      type: string
      example: cairn_session=…; Path=/; HttpOnly; SameSite=Lax; Max-Age=2592000
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Overall server status.
        database:
          type: string
          enum: [ok, error]
          description: Status of the server-level database check.
    Version:
      type: object
      required: [version, commit, build_date, go_version, platform]
      properties:
        version:
          type: string
          description: Semantic version; "dev" for local builds.
          example: dev
        commit:
          type: string
          description: Git commit the binary was built from.
          example: 1a2b3c4
        build_date:
          type: string
          example: 2026-09-22T14:06:56Z
        go_version:
          type: string
          example: go1.26.4
        platform:
          type: string
          description: os/arch the binary was built for.
          example: linux/amd64
  parameters:
    RequestIdHeader:
      name: X-Request-ID
      in: header
      required: false
      description: >
        Client-provided request identifier echoed in the response header and in
        error bodies. Must be 1-128 chars of letters, digits, '-', '_', ':'.
      schema:
        type: string
  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, expired, or invalid session; or failed login
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not permitted (e.g. non-admin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The request conflicts with the current state (e.g. duplicate username or double bootstrap)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cairn_session
      description: >
        Opaque session token issued by /auth/login or /auth/bootstrap and stored
        in an HttpOnly, SameSite=Lax cookie. Only the SHA-256 digest is kept
        server-side; sessions expire after 30 days and are revoked on logout.
        By default every path requires this scheme; public endpoints declare
        `security: [{}]` explicitly.